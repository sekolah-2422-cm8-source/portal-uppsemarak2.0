<title>Jana Jadual Peperiksaan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Lexend:wght@400;500;600&display=swap">
<style>
/* Layout: one column app — category chips, four tabs (Jadual / Subjek / Waktu / Tetapan), paper preview below. */
:root{
  --bg:#F3F5FA; --surface:#FFFFFF; --soft:#E8ECF5; --line:#D6DCE8; --fg:#1A1F2E; --muted:#5D6680;
  --accent:#2F6FEB; --ok:#12A56B; --warn:#D97706; --bad:#DC3545;
  --c-per:#0E9F8C; --c-t12:#2F6FEB; --c-t3:#8B5CF6; --c-t4:#EA8A00; --c-t5:#E5484D;
  --display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body:"Lexend", "Segoe UI", system-ui, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11141C; --surface:#1A1E2A; --soft:#242a39; --line:#323a4e; --fg:#EEF1F8; --muted:#A3ADC4; --accent:#6C9CFF; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11141C; --surface:#1A1E2A; --soft:#242a39; --line:#323a4e; --fg:#EEF1F8; --muted:#A3ADC4; --accent:#6C9CFF; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 60px}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,6vw,36px);margin:0;letter-spacing:-.5px;line-height:1.05}
h1 span{color:var(--cat)}
.sub{color:var(--muted);margin:4px 0 0;font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
/* category chips */
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.cat{flex:0 0 auto;padding:9px 14px;border-radius:999px;background:var(--surface);border:2px solid var(--line);font-weight:600;font-size:14px;transition:transform .12s}
.cat i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:7px}
.cat[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.cat[aria-pressed="true"] i{background:#fff}
.cat:active{transform:scale(.95)}
/* tabs */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--soft);border-radius:var(--r);padding:4px;gap:4px}
.tab{padding:10px 4px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.panel{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
[hidden]{display:none!important}
#warns:empty{display:none}
#warns{display:flex;flex-direction:column;gap:8px}
.tg{display:flex;align-items:center;gap:10px;flex-wrap:nowrap}
.tgs{display:flex;flex-direction:column;gap:10px}
input[type=text],input[type=number],select{height:44px}
html.embed header{display:none}
html.embed body{padding-block:12px 40px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.row>.f{flex:1 1 140px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
.g2>.f{min-width:0}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:start}
.g5{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.ev .g2,.bell .g2{align-items:start}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;display:block;height:44px;line-height:24px;min-width:0;max-width:100%;text-align:left}
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value{text-align:left}
.f label,.lab{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.3px;text-transform:uppercase}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:90px}
.big{background:var(--cat);color:#fff;font-family:var(--display);font-weight:800;font-size:18px;padding:14px 18px;border-radius:var(--r);width:100%;box-shadow:0 4px 0 color-mix(in srgb,var(--cat) 60%,#000);transition:transform .08s,box-shadow .08s}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--cat) 60%,#000)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns>.btn:nth-child(3){grid-column:1/-1}
.btn{padding:11px 12px;border-radius:12px;font-weight:600;background:var(--soft);border:1.5px solid var(--line)}
.btn.col{background:color-mix(in srgb,var(--cat) 14%,var(--surface));border-color:color-mix(in srgb,var(--cat) 45%,var(--line));color:var(--fg)}
.btn:disabled{opacity:.5}
.mini{padding:6px 9px;border-radius:8px;background:var(--soft);font-size:13px;font-weight:600}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.pill{padding:5px 11px;border-radius:999px;font-size:13px;font-weight:600;background:var(--soft)}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.warn{border-left:4px solid var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent);padding:10px 12px;border-radius:8px;font-size:14px}
/* subjects */
.subj{display:flex;flex-direction:column;gap:8px}
.s{display:flex;flex-direction:column;gap:7px;padding:8px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg)}
.s.off{opacity:.5}
.s1,.s2{display:flex;gap:5px;align-items:center;min-width:0}
.s1 .nm{flex:1;min-width:0;height:40px;font-size:14px;padding:8px}
.s2 .kd{width:52px;font-size:14px;flex:none;height:36px;padding:6px 8px}
.s2 .mn{width:48px;font-size:14px;flex:none;height:36px;padding:6px 6px}
.s2 .sp{flex:1}
@media (max-width:380px){.s2 .kd{width:44px;padding:6px 5px}.s2 .mn{width:42px;padding:6px 4px}.teras{padding:5px 7px;font-size:11px}.pin{min-width:32px;padding:0 5px}.s .mini{min-width:28px}.s1,.s2{gap:4px}}
.pin{position:relative;flex:none;height:36px;min-width:36px;padding:0 8px;border-radius:8px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.pin.on{background:var(--cat);color:#fff}
.pin select{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.s .mini{height:36px;min-width:32px;padding:0}
.s .mini:disabled{opacity:.35}
.dur{font-size:12px;color:var(--muted);font-weight:500}
.teras{padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700;border:1.5px solid var(--line);color:var(--muted)}
.teras[aria-pressed="true"]{background:var(--cat);border-color:var(--cat);color:#fff}
.sw{appearance:none;width:42px;height:24px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;transition:background .15s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.sw:checked{background:var(--cat)}
.sw:checked::after{left:21px}
.arr{display:flex;gap:4px}
/* bell tables */
.bells{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.bell{border:1.5px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.bell h3{margin:0;font-family:var(--display);font-size:17px}
.btab{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.btab td{padding:4px 6px;border-bottom:1px solid var(--line)}
.btab tr.r td{background:color-mix(in srgb,#F5C518 25%,transparent);font-weight:700}
.ev{display:grid;grid-template-columns:1fr;gap:8px;padding:10px;border:1.5px solid var(--line);border-radius:12px}
.ev .row{align-items:center}
.h2{font-family:var(--display);font-size:18px;font-weight:800;margin:0}
/* preview */
.prevbox{background:var(--soft);border-radius:var(--r);padding:12px;overflow:hidden}
.prevscale{transform-origin:top left}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(120px);background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:600;transition:transform .25s;z-index:50;max-width:90vw;text-align:center}
.toast.on{transform:translateX(-50%) translateY(0)}
.ovl{position:fixed;inset:0;background:rgba(10,12,20,.75);z-index:60;display:flex;flex-direction:column;align-items:center;gap:12px;padding:calc(20px + env(safe-area-inset-top,0px)) 16px 20px;overflow:auto}
.ovl img{max-width:100%;background:#fff;border-radius:6px}
.ovl p{color:#fff;margin:0;text-align:center;font-weight:600;min-height:1em}
.ovl .big{--cat:var(--c-t12)}
#render{position:fixed;left:-20000px;top:0;width:794px}
/* ===== paper sheet (prints like the school's sample) ===== */
.sheet{width:794px;background:#fff;color:#000;font-family:Arial,Helvetica,sans-serif;padding:44px 80px 50px}
.sh-head{display:flex;align-items:center;margin:0 0 32px;padding-left:8px}
.sh-logo{width:104px;height:104px;object-fit:contain;flex:none;margin-right:14px}
.sh-box{flex:1;border:1px solid #000;padding:18px 12px;text-align:center;font-weight:700;font-size:17px;line-height:1.6}
.sh-tab{width:100%;border-collapse:collapse;font-size:14px}
.sh-tab th{background:#D9D9D9;font-weight:700;padding:14px 6px;border:1px solid #000}
.sh-tab td{border:1px solid #000;padding:12px 6px;text-align:center;vertical-align:middle;line-height:1.35}
.sh-tab td.d{font-weight:700;vertical-align:top;padding-top:12px}
.sh-tab tr.rh td:not(.d){background:#FCE8A4;font-weight:700}
.sh-tab tr.uk td.m{font-style:italic}
.sh-tab tr.evt td:not(.d){background:#EFEFEF;font-style:italic}
.sh-note{margin-top:30px;padding-left:10px;font-weight:700;font-style:italic;font-size:14px}
.sh-note ol{margin:10px 0 0;padding-left:18px}
.sh-note li{margin-bottom:9px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap" id="app" style="--cat:var(--c-t12)">
  <header>
    <h1>Jana Jadual <span>Peperiksaan</span></h1>
  </header>

  <nav class="cats" id="cats" aria-label="Kategori"></nav>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-t="jadual" aria-selected="true">Jadual</button>
    <button class="tab" role="tab" data-t="subjek">Subjek</button>
    <button class="tab" role="tab" data-t="waktu">Waktu</button>
    <button class="tab" role="tab" data-t="tetapan">Tetapan</button>
  </div>

  <!-- JADUAL -->
  <section class="panel" id="p-jadual">
    <div class="f"><label for="examName">Nama peperiksaan</label><input type="text" id="examName"></div>
    <div class="g2">
      <div class="f"><label for="dStart">Tarikh mula</label><input type="date" id="dStart"></div>
      <div class="f"><label for="dEnd">Tarikh akhir</label><input type="date" id="dEnd"></div>
    </div>
    <button class="big" id="go">✦ Jana Jadual</button>
    <div class="stats" id="stats"></div>
    <div id="warns"></div>
    <div class="btns">
      <button class="btn col" id="xImg">Simpan Gambar</button>
      <button class="btn col" id="xPdf">Simpan PDF</button>
      <button class="btn" id="xAll">PDF Semua Kategori (5 jadual)</button>
    </div>
  </section>

  <!-- SUBJEK -->
  <section class="panel" id="p-subjek" hidden>
    <div class="row" style="justify-content:space-between;align-items:center">
      <p class="h2">Kertas <span id="subjCount" class="dur"></span></p>
      <button class="mini" id="resetSubj">Pulih asal</button>
    </div>
    <p class="sub" style="margin:0">Atas = didahulukan. <b>Teras</b> dijadual dulu.</p>
    <div class="subj" id="subj"></div>
    <button class="btn" id="addSubj">+ Tambah kertas</button>
  </section>

  <!-- WAKTU -->
  <section class="panel" id="p-waktu" hidden>
    <div class="bells" id="bells"></div>
    <p class="h2">Waktu balik</p>
    <div class="g5" id="balik"></div>
    <p class="h2">Aktiviti tetap</p>
    <p class="sub" style="margin:0">Kertas tidak akan diletak pada masa ini.</p>
    <div class="subj" id="events"></div>
    <button class="btn" id="addEv">+ Tambah aktiviti</button>
  </section>

  <!-- TETAPAN -->
  <section class="panel" id="p-tetapan" hidden>
    <div class="g2">
      <div class="f"><label for="firstStart">Kertas pertama</label><input type="time" id="firstStart" step="300"></div>
      <div class="f"><label for="capEnd">Tamat sebelum</label><input type="time" id="capEnd" step="300"></div>
    </div>
    <div class="g2">
      <div class="f"><label for="maxDay">Maks sehari</label><select id="maxDay"><option>1</option><option>2</option><option>3</option></select></div>
      <div class="f"><label for="revMin">Ulangkaji antara</label><select id="revMin"><option value="0">Tiada</option><option value="30">30 minit</option><option value="60">1 jam</option><option value="90">1 jam 30 minit</option><option value="120">2 jam</option></select></div>
    </div>
    <div class="tgs">
      <label class="tg"><input type="checkbox" class="sw" id="revMorning"> Ulangkaji pagi</label>
      <label class="tg"><input type="checkbox" class="sw" id="showKod"> Papar kod kertas</label>
      <label class="tg"><input type="checkbox" class="sw" id="sound"> Bunyi</label>
    </div>
    <div class="f"><span class="lab">Hari tiada ujian</span><div class="row" id="skipDays" style="gap:6px"></div></div>
    <div class="f"><label for="cuti">Cuti (dd/mm/yyyy, koma)</label><input type="text" id="cuti" placeholder="cth: 31/10/2026, 4/11/2026"></div>
    <div class="f"><label for="note">Perhatian · satu baris satu nota</label><textarea id="note"></textarea></div>
    <div class="f"><span class="lab">Logo sekolah</span>
      <div class="row" style="align-items:center"><img id="logoPrev" alt="" style="width:52px;height:52px;object-fit:contain;background:#fff;border-radius:8px;border:1px solid var(--line)"><input type="file" id="logo" accept="image/*" style="flex:1;min-width:0"><button class="mini" id="logoDef">Logo asal</button><button class="mini" id="logoX">Buang</button></div>
    </div>
  </section>

  <section class="prevbox" id="prevbox" aria-label="Pratonton"><div class="prevscale" id="prev"></div></section>
</div>
<div id="render" aria-hidden="true"></div>
<div class="toast" id="toast" role="status"></div>

let AC=null;
function tone(seq){ if(!S.sound)return; try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  let t=AC.currentTime; seq.forEach(([f,d,type])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type||"sine";o.frequency.value=f;
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);t+=d*.7});}catch(e){} }

/* ---------- time helpers ---------- */
const tm=s=>{const[h,m]=String(s||"0:0").split(":").map(Number);return h*60+(m||0)};
const hm=m=>`${String(Math.floor(m/60)).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`;
const f12=m=>{let h=Math.floor(m/60)%24;const mm=m%60;h=h%12||12;return `${h}.${String(mm).padStart(2,"0")}`};
const range=(a,b)=>`${f12(a)} - ${f12(b)} ${b>=720?"PM":"AM"}`;
const tempoh=m=>{const h=Math.floor(m/60),r=m%60;return [h?`${h} Jam`:"",r?`${r} Minit`:""].filter(Boolean).join(" ")||"0 Minit"};
const tempohL=m=>tempoh(m).toLowerCase();

function bellOf(b){ // [{label,s,e,rehat}]
  const out=[];let t=tm(b.start);
  for(let i=1;i<=b.n;i++){out.push({label:String(i),s:t,e:t+ +b.per});t+= +b.per;
    if(i===+b.rehatAfter){out.push({label:"REHAT",s:t,e:t+ +b.rehatMin,rehat:true});t+= +b.rehatMin}}
  return out;
}

/* ---------- scheduler ---------- */
function dayModel(cat,date){
  const dow=date.getDay(),bell=bellOf(S.bells[cat.blok]);
  const blocks=bell.filter(p=>p.rehat).map(p=>({s:p.s,e:p.e,kind:"rehat",name:"Rehat"}));
  S.events.filter(e=>e.on&&+e.day===dow&&(e.blok==="semua"||e.blok===cat.blok)&&tm(e.to)>tm(e.from))
    .forEach(e=>blocks.push({s:tm(e.from),e:tm(e.to),kind:"evt",name:e.name}));
  const end=Math.min(tm(S.balik[dow]||"15:00"),tm(S.opt.capEnd));
  return {date,dow,bell,blocks,grid:bell.filter(p=>!p.rehat).map(p=>p.s),dayStart:bell[0].s,first:tm(S.opt.firstStart),end};
}
const hits=(a,b,bl)=>bl.some(x=>x.s<b&&x.e>a);
const freeMin=(a,b,bl)=>{let f=b-a;bl.forEach(x=>{const o=Math.min(b,x.e)-Math.max(a,x.s);if(o>0)f-=o});return f};
function place(dm,cursor,dur,gap){
  for(const t of dm.grid){ if(t<cursor||t<dm.first)continue; if(t+dur>dm.end)break;
    if(hits(t,t+dur,dm.blocks))continue; if(gap>0&&freeMin(cursor,t,dm.blocks)<gap)continue; return t }
  return null;
}
function placeFirst(dm,dur){ // first paper: if it would be pushed past rehat, start earlier (from waktu 1) instead
  const t=place(dm,dm.first,dur,0),rh=dm.blocks.find(b=>b.kind==="rehat");
  if(t!=null&&rh&&t>=rh.e){for(const g of dm.grid){if(g>=dm.first)break;if(g+dur<=rh.s&&!hits(g,g+dur,dm.blocks))return g}}
  return t;
}
function examDates(cs,maxN){
  const out=[],skip=new Set(S.opt.skip.map(Number)),cuti=new Set(S.opt.cuti.split(",").map(parseDMY).filter(Boolean));
  if(!cs.start)return out; let d=toDate(cs.start);const end=cs.end?toDate(cs.end):null;
  for(let i=0;i<120&&out.length<maxN;i++){ if(end&&d>end)break;
    if(!skip.has(d.getDay())&&!cuti.has(iso(d)))out.push(new Date(d)); d.setDate(d.getDate()+1)}
  return out;
}
function schedule(catId){
  const cat=CATS.find(c=>c.id===catId),cs=S.cats[catId];
  const on=cs.subjects.map((x,i)=>({...x,i})).filter(x=>x.on&&+x.min>0);
  const gT={};on.forEach(x=>{if(x.teras)gT[base(x.name)]=1});
  const pinned=on.filter(x=>x.pin), queue=on.filter(x=>!x.pin).sort((a,b)=>((gT[base(a.name)]?0:1)-(gT[base(b.name)]?0:1))||a.i-b.i);
  const dates=examDates(cs,cs.end?999:60), days=[], warns=[];
  const gap=+S.opt.revMin, maxD=+S.opt.maxDay;
  let qi=0;
  for(const date of dates){
    const dm=dayModel(cat,date),items=[];let cur=dm.first,cnt=0;
    for(const u of pinned.filter(p=>p.pin===iso(date))){
      const t=cnt?(place(dm,cur,+u.min,gap)??place(dm,cur,+u.min,0)):placeFirst(dm,+u.min);
      if(t==null){warns.push(`“${u.name}” tidak muat pada ${dSl(date)} — ubah tarikh pin.`);continue}
      items.push({...u,s:t,e:t+ +u.min});cur=t+ +u.min;cnt++;
    }
    while(qi<queue.length&&cnt<maxD){
      const u=queue[qi];
      let t=cnt?(place(dm,cur,+u.min,gap)??place(dm,cur,+u.min,0)):placeFirst(dm,+u.min);
      if(t==null){ if(!items.length){ // short day (e.g. Friday): pull forward the first paper that fits
          const j=queue.findIndex((v,k)=>k>qi&&place(dm,cur,+v.min,0)!=null);
          if(j>0){const [v]=queue.splice(j,1);queue.splice(qi,0,v);continue}}
        break }
      items.push({...u,s:t,e:t+ +u.min});cur=t+ +u.min;cnt++;qi++;
    }
    if(items.length)days.push({dm,items});
    if(qi>=queue.length&&!pinned.some(p=>toDate(p.pin)>date))break;
  }
  if(qi<queue.length)warns.push(`${queue.length-qi} kertas tidak muat: ${queue.slice(qi).map(x=>x.name).join(", ")}. Lanjutkan tarikh akhir atau naikkan maks kertas sehari.`);
  pinned.forEach(p=>{if(!dates.some(d=>iso(d)===p.pin))warns.push(`Tarikh pin “${p.name}” bukan hari peperiksaan.`)});
  days.sort((a,b)=>a.dm.date-b.dm.date);
  return {cat,cs,days,warns,count:days.reduce((n,d)=>n+d.items.length,0)};
}
function rowsOf(day){
  const {dm,items}=day;items.sort((a,b)=>a.s-b.s);
  const last=items[items.length-1].e, rows=[];
  dm.blocks.forEach(b=>{ if(b.kind==="rehat"&&b.s<last&&b.s>=dm.dayStart) rows.push({k:"rh",s:b.s,e:b.e,name:"Rehat",dur:b.e-b.s});
    if(b.kind==="evt"&&b.s<last) rows.push({k:"evt",s:b.s,e:b.e,name:b.name}) });
  let prevEnd=dm.dayStart;
  items.forEach((it,i)=>{
    const want=(i>0&&+S.opt.revMin>0)||(i===0&&S.opt.revMorning);
    if(want&&it.s>prevEnd){ // free segments → ulangkaji
      const cuts=[prevEnd,it.s];dm.blocks.forEach(b=>{if(b.s>prevEnd&&b.s<it.s)cuts.push(b.s);if(b.e>prevEnd&&b.e<it.s)cuts.push(b.e)});
      cuts.sort((a,b)=>a-b);
      for(let j=0;j<cuts.length-1;j++){const a=cuts[j],b=cuts[j+1];if(b>a&&!hits(a,b,dm.blocks))rows.push({k:"uk",s:a,e:b,name:"Ulangkaji "+base(it.name)})}
    }
    rows.push({k:"p",s:it.s,e:it.e,name:it.name+(S.opt.showKod&&it.kod?` (${it.kod})`:""),dur:+it.min});
    prevEnd=Math.max(it.e,prevEnd);
  });
  rows.sort((a,b)=>a.s-b.s||(a.k==="p")-(b.k==="p"));
  // merge adjacent ulangkaji with same name
  const m=[];rows.forEach(r=>{const p=m[m.length-1];if(p&&p.k==="uk"&&r.k==="uk"&&p.name===r.name&&p.e===r.s)p.e=r.e;else m.push(r)});
  return m;
}

async function deliver(blob,name,previews){
  const dl=await dlP;
  if(dl){try{await dl.save({filename:name,data:blob});sPop();toast("Disimpan ✓");return}
    catch(e){if(e&&e.code==="declined"){toast("Dibatalkan");return}if(e&&e.code==="rate_limited"){toast("Tunggu sebentar, cuba lagi");return}}}
  // own website / portal: show the result with a fresh tap for Share (iPhone needs a tap right before sharing)
  const file=new File([blob],name,{type:blob.type});
  const canShare=!!(navigator.canShare&&navigator.canShare({files:[file]}));
  const o=document.createElement("div");o.className="ovl";
  o.innerHTML=`<div class="btns" style="width:100%;max-width:520px">${canShare?`<button class="big" data-o="share">Kongsi / Simpan</button>`:""}<button class="${canShare?"btn":"big"}" data-o="dl">Muat turun</button><button class="btn" data-o="x">Tutup</button></div><p id="ovlMsg"></p>`;
  (previews||[]).forEach(u=>{const im=new Image();im.src=u;im.alt="";o.appendChild(im)});
  o.addEventListener("click",async e=>{const k=e.target.dataset.o;if(!k)return;
    if(k==="x"){o.remove();return}
    if(k==="share"){try{await navigator.share({files:[file],title:name});sPop();o.remove();toast("Dikongsi ✓")}
      catch(err){if(err&&err.name!=="AbortError")o.querySelector("#ovlMsg").textContent="Kongsi tidak dibenarkan di sini. Tekan Muat turun."}return}
    if(k==="dl"){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
      setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},60000);sPop();
      o.querySelector("#ovlMsg").textContent="Jika tiada apa berlaku, buka alat ini terus dalam Safari/Chrome (bukan pratonton)."}});
  document.body.appendChild(o);sPop();
}
function addPages(pdf,cap,first){
  const {canvas,cuts}=cap,W=190,M=10,pageH=277,pxmm=canvas.width/W,maxPx=pageH*pxmm;const imgs=[];
  let y=0;while(y<canvas.height-2){let end=y+maxPx;if(end<canvas.height){const ok=cuts.filter(c=>c>y+20&&c<=end);if(ok.length)end=ok[ok.length-1]}else end=canvas.height;
    const c=document.createElement("canvas");c.width=canvas.width;c.height=Math.ceil(end-y);const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);
    g.drawImage(canvas,0,y,canvas.width,c.height,0,0,canvas.width,c.height);
    if(!first.v)pdf.addPage();first.v=false;const u=c.toDataURL("image/jpeg",.92);imgs.push(u);pdf.addImage(u,"JPEG",M,M,W,c.height/pxmm);y=end}

async function busy(btn,fn){if(btn.disabled)return;const t=btn.textContent;btn.disabled=true;btn.textContent="Menjana…";
  try{await fn()}catch(e){sErr();toast("Gagal menjana: "+(e.message||e))}finally{btn.disabled=false;btn.textContent=t}}
$("#xImg").addEventListener("click",e=>busy(e.target,async()=>{const res=schedule(S.cur);const {canvas}=await capture(res);
  const url=canvas.toDataURL("image/png");const blob=await new Promise(r=>canvas.toBlob(r,"image/png"));await deliver(blob,fname(res,"png"),[url])}));
$("#xPdf").addEventListener("click",e=>busy(e.target,async()=>{const res=schedule(S.cur);const pdf=new jspdf.jsPDF({unit:"mm",format:"a4"});
  const imgs=addPages(pdf,await capture(res),{v:true});await deliver(pdf.output("blob"),fname(res,"pdf"),imgs)}));
$("#xAll").addEventListener("click",e=>busy(e.target,async()=>{const pdf=new jspdf.jsPDF({unit:"mm",format:"a4"}),first={v:true},imgs=[];
  for(const c of CATS){const res=schedule(c.id);if(!res.days.length)continue;imgs.push(...addPages(pdf,await capture(res),first))}
  if(first.v){toast("Tiada jadual untuk dijana");return}
  await deliver(pdf.output("blob"),`Jadual Peperiksaan Semua Kategori ${today.getFullYear()}.pdf`,imgs)}));

renderAll();
</script>
